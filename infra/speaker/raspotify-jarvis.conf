# /etc/systemd/system/raspotify.service.d/jarvis.conf
# Spotify Connect con el nombre "Jarvis", sacando el audio por el FIFO que lee
# jarvis-speaker (que es el único dueño del jack; ALSA dmix se cuelga en esta Pi).
[Unit]
After=jarvis-speaker.service
Wants=jarvis-speaker.service

[Service]
Environment=LIBRESPOT_NAME=Jarvis
Environment=LIBRESPOT_BACKEND=pipe
Environment=LIBRESPOT_DEVICE=/run/jarvis-speaker/music.fifo
Environment=LIBRESPOT_FORMAT=S16
Environment=LIBRESPOT_BITRATE=320
Environment=LIBRESPOT_INITIAL_VOLUME=60
Environment=LIBRESPOT_DEVICE_TYPE=speaker
# Si jarvis-speaker se reinicia, librespot puede morir por el pipe: que vuelva.
Restart=always
RestartSec=3
